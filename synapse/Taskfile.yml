version: '3'

env:
  DB_PATH: 'kuma-sync.db'
  KUMA_URL: 'http://uptime-kuma:3001'
  KUMA_USER: 'admin'
  KUMA_PASS: ''

tasks:
  default:
    desc: Run the server with hot reload
    deps: [install-air]
    cmds:
      - air

  build:
    desc: Build the server binary
    cmds:
      - go build -o bin/server ./cmd/server

  run:
    desc: Build and run the server
    cmds:
      - task: build
      - ./bin/server

  install-air:
    desc: Install air for hot reload
    cmds:
      - command -v air >/dev/null 2>&1 || go install github.com/air-verse/air@latest
    status:
      - command -v air >/dev/null 2>&1

  test:
    desc: Run tests
    cmds:
      - go test ./...
