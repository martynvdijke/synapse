[project]
name = "kuma-sync"
version = "0.1.0"
description = "Sync docker-compose containers and NPM proxy hosts to Uptime Kuma"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.31.0",
    "uptime-kuma-api>=1.2.1",
]

[project.scripts]
kuma-sync = "kuma_sync.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"