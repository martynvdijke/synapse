version: "3"
services:
  web:
    image: nginx:alpine
    container_name: nginx-web
    ports:
      - "80:80"
      - "443:443/tcp"
    environment:
      NGINX_HOST: example.com
      NGINX_PORT: "80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - api
    labels:
      app: web
      tier: frontend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  api:
    image: myapp:latest
    container_name: myapp-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: myapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s

  redis:
    image: redis:8
    container_name: cache-redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  worker:
    image: myworker:latest
    entrypoint: /entrypoint.sh
    user: nobody
    working_dir: /app
    healthcheck:
      test: wget --spider http://localhost:9090/ready
      interval: 15s
