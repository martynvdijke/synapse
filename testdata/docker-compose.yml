version: "3"
services:
  web:
    image: nginx:alpine
    container_name: nginx-web
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s

  api:
    image: myapp:latest
    container_name: myapp-api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s

  redis:
    image: redis:8
    container_name: cache-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  worker:
    image: myworker:latest
    healthcheck:
      test: wget --spider http://localhost:9090/ready
      interval: 15s
