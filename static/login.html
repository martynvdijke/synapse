<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse — Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/brand/synapse-mark.svg">
    <meta name="theme-color" content="#111A38">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: .5rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 40px; width: 100%; max-width: 420px; }
        .auth-mark { width: 64px; height: 64px; border-radius: 16px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <img class="auth-mark" src="/static/brand/synapse-mark.svg" alt="" width="64" height="64">
            <h4 class="mt-3 mb-0">Synapse Login</h4>
        </div>
        <div id="error" class="alert alert-danger d-none"></div>
        <form id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const errorDiv = document.getElementById('error');
            errorDiv.classList.add('d-none');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: fd.get('username'),
                    password: fd.get('password')
                })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                const err = await res.json();
                errorDiv.textContent = err.error || 'Invalid credentials';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
