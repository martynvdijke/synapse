<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Synapse circuit mark</title>
  <desc id="desc">An angular circuit trace routes through a glowing processor core.</desc>
  <defs>
    <linearGradient id="case" x1="55" y1="35" x2="455" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111C32"/>
      <stop offset="1" stop-color="#080D18"/>
    </linearGradient>
    <linearGradient id="trace" x1="135" y1="151" x2="373" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FF3C"/>
      <stop offset="0.52" stop-color="#42E0FF"/>
      <stop offset="1" stop-color="#A48BFF"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(256 256) rotate(90) scale(66)">
      <stop stop-color="#F4FFD7"/>
      <stop offset="0.18" stop-color="#B8FF3C"/>
      <stop offset="0.56" stop-color="#42E0FF"/>
      <stop offset="1" stop-color="#42E0FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#84A3C7" fill-opacity="0.18"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="#050A12"/>
  <path d="M128 28H384L484 128V384L384 484H128L28 384V128L128 28Z" fill="url(#case)" stroke="#273A58" stroke-width="6"/>
  <path d="M144 56H372L456 140V372L372 456H144L56 372V140L144 56Z" fill="url(#dots)" opacity="0.72"/>
  <path d="M144 56H372L456 140V372L372 456H144L56 372V140L144 56Z" fill="none" stroke="#4B6A91" stroke-opacity="0.45" stroke-width="3"/>

  <g fill="none" stroke-linecap="square" stroke-width="7">
    <path d="M104 140H141V178" stroke="#42E0FF"/>
    <path d="M371 104V151H408" stroke="#B8FF3C"/>
    <path d="M104 371H141V334" stroke="#A48BFF"/>
    <path d="M371 408V360H408" stroke="#42E0FF"/>
  </g>
  <g fill="#B8FF3C">
    <rect x="95" y="131" width="18" height="18" rx="3"/>
    <rect x="399" y="95" width="18" height="18" rx="3"/>
  </g>
  <g fill="#42E0FF">
    <rect x="95" y="362" width="18" height="18" rx="3"/>
    <rect x="399" y="399" width="18" height="18" rx="3"/>
  </g>

  <path d="M364 153H194L141 206L194 256H318L371 306L318 359H141" fill="none" stroke="#02060D" stroke-linecap="square" stroke-linejoin="miter" stroke-width="34"/>
  <path d="M364 153H194L141 206L194 256H318L371 306L318 359H141" fill="none" stroke="url(#trace)" stroke-linecap="square" stroke-linejoin="miter" stroke-width="17"/>

  <g fill="#080D18" stroke-width="6">
    <rect x="347" y="136" width="34" height="34" rx="4" stroke="#B8FF3C"/>
    <rect x="124" y="189" width="34" height="34" rx="4" stroke="#42E0FF"/>
    <rect x="354" y="289" width="34" height="34" rx="4" stroke="#A48BFF"/>
    <rect x="124" y="342" width="34" height="34" rx="4" stroke="#42E0FF"/>
  </g>
  <g fill="#F4FFD7">
    <rect x="359" y="148" width="10" height="10" rx="2"/>
    <rect x="136" y="201" width="10" height="10" rx="2"/>
    <rect x="366" y="301" width="10" height="10" rx="2"/>
    <rect x="136" y="354" width="10" height="10" rx="2"/>
  </g>

  <circle cx="256" cy="256" r="68" fill="url(#core)" opacity="0.55" filter="url(#glow)"/>
  <path d="M239 220H273L292 239V273L273 292H239L220 273V239L239 220Z" fill="#081321" stroke="#B8FF3C" stroke-width="6"/>
  <path d="M247 239H265L273 247V265L265 273H247L239 265V247L247 239Z" fill="#42E0FF"/>
  <circle cx="256" cy="256" r="5" fill="#F4FFD7"/>
  <g stroke="#B8FF3C" stroke-linecap="square" stroke-width="5">
    <path d="M220 246H208M220 266H208M292 246H304M292 266H304"/>
    <path d="M246 220V208M266 220V208M246 292V304M266 292V304"/>
