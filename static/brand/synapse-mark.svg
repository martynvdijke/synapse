    <circle cx="408" cy="171" r="5"/>
    <circle cx="408" cy="191" r="5"/>
  </g>
  <text x="88" y="425" fill="#718AA9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2">SYN // 01</text>
  <text x="340" y="425" fill="#B8FF3C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2">READY</text>
</svg>
