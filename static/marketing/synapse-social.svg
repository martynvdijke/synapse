      <path d="M84 142L90 148L100 136" fill="none" stroke="#8CEBFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
      <text x="55" y="120" fill="#C9DEEF" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">DOCKER</text>
    </g>
    <g>
      <circle cx="300" cy="142" r="17" fill="#1D2145" stroke="#A58BFF" stroke-width="4"/>
      <path d="M293 142L299 148L309 136" fill="none" stroke="#D8D0FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
      <text x="292" y="120" fill="#D8D0FF" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">NPM</text>
    </g>
    <g>
      <circle cx="91" cy="336" r="17" fill="#332536" stroke="#FF8969" stroke-width="4"/>
      <path d="M84 336L90 342L100 330" fill="none" stroke="#FFD4C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
      <text x="44" y="371" fill="#FFD4C8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">AUTHELIA</text>
    </g>
    <g>
      <circle cx="300" cy="336" r="17" fill="#17352F" stroke="#72E39D" stroke-width="4"/>
      <path d="M293 336L299 342L309 330" fill="none" stroke="#B8F5CB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
      <text x="275" y="371" fill="#B8F5CB" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">KUMA</text>
    </g>
