  <path d="M76 568H1124" fill="none" stroke="#5DE4FF" stroke-opacity="0.25"/>
  <text x="76" y="594" fill="#6E87A5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">UPTIME Kuma monitor sync for self-hosted infrastructure</text>
