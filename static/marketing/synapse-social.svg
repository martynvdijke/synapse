    <path d="M364 153H194L141 206L194 256H318L371 306L318 359H141" fill="none" stroke="#42E0FF" stroke-linecap="square" stroke-linejoin="miter" stroke-width="17"/>
    <rect x="347" y="136" width="34" height="34" rx="4" fill="#080D18" stroke="#B8FF3C" stroke-width="6"/>
    <rect x="124" y="189" width="34" height="34" rx="4" fill="#080D18" stroke="#42E0FF" stroke-width="6"/>
    <rect x="354" y="289" width="34" height="34" rx="4" fill="#080D18" stroke="#A48BFF" stroke-width="6"/>
    <rect x="124" y="342" width="34" height="34" rx="4" fill="#080D18" stroke="#42E0FF" stroke-width="6"/>
    <path d="M239 220H273L292 239V273L273 292H239L220 273V239L239 220Z" fill="#081321" stroke="#B8FF3C" stroke-width="6"/>
    <path d="M247 239H265L273 247V265L265 273H247L239 265V247L247 239Z" fill="#42E0FF"/>
    <circle cx="256" cy="256" r="5" fill="#F4FFD7"/>
