  <text x="170" y="106" fill="#B8FF3C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">SYNAPSE // SIGNAL NETWORK</text>

  <text x="76" y="230" fill="#F4F8FF" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">One signal</text>
  <text x="76" y="300" fill="#F4F8FF" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">for every service.</text>
  <text x="76" y="358" fill="#A8BBD2" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">Discover, sync and protect your self-hosted stack.</text>

  <g transform="translate(76 425)">
    <rect width="116" height="38" rx="19" fill="#122C43" stroke="#35D8FF" stroke-opacity="0.45"/>
    <circle cx="20" cy="19" r="5" fill="#35D8FF"/>
    <text x="35" y="25" fill="#DDF9FF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">DISCOVER</text>
    <rect x="128" width="92" height="38" rx="19" fill="#1D2145" stroke="#A58BFF" stroke-opacity="0.5"/>
    <circle cx="148" cy="19" r="5" fill="#A58BFF"/>
    <text x="163" y="25" fill="#F0EBFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SYNC</text>
    <rect x="232" width="111" height="38" rx="19" fill="#332536" stroke="#FF8969" stroke-opacity="0.5"/>
    <circle cx="252" cy="19" r="5" fill="#FF8969"/>
    <text x="267" y="25" fill="#FFF0EA" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">PROTECT</text>
  </g>

  <g transform="translate(735 90)">
    <rect width="390" height="450" rx="28" fill="#0C1A2D" fill-opacity="0.9" stroke="#83A1C5" stroke-opacity="0.24" stroke-width="2"/>
    <rect x="24" y="24" width="342" height="38" rx="12" fill="#14263C"/>
    <circle cx="45" cy="43" r="5" fill="#FF8969"/>
    <circle cx="62" cy="43" r="5" fill="#F6C85F"/>
    <circle cx="79" cy="43" r="5" fill="#72E39D"/>
    <text x="105" y="48" fill="#8FA8C4" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SIGNAL MAP</text>

    <circle cx="195" cy="240" r="155" fill="url(#halo)"/>
    <path d="M195 240L91 142M195 240L300 142M195 240L91 336M195 240L300 336M195 240L195 367" fill="none" stroke="url(#accent)" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M195 240C242 197 253 168 300 142" fill="none" stroke="#D2C9FF" stroke-opacity="0.35" stroke-dasharray="5 8" stroke-width="2"/>
    <circle cx="195" cy="240" r="48" fill="#0B1930" stroke="#8EEBFF" stroke-width="4" filter="url(#softGlow)"/>
    <circle cx="195" cy="240" r="24" fill="url(#accent)"/>
    <circle cx="195" cy="240" r="9" fill="#F5FCFF"/>

    <g>
