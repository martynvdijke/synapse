    <path d="M144 56H372L456 140V372L372 456H144L56 372V140L144 56Z" fill="none" stroke="#4B6A91" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M104 140H141V178M371 104V151H408M104 371H141V334M371 408V360H408" fill="none" stroke="#42E0FF" stroke-linecap="square" stroke-width="7"/>
