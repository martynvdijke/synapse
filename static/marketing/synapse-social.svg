<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Synapse, one signal for every service</title>
  <desc id="desc">A dark marketing illustration showing Docker, Nginx Proxy Manager, Authelia and Uptime Kuma connected through Synapse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081221"/>
      <stop offset="0.58" stop-color="#0D1C32"/>
      <stop offset="1" stop-color="#17234B"/>
    </linearGradient>
    <linearGradient id="accent" x1="780" y1="128" x2="1085" y2="475" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FF3C"/>
      <stop offset="0.5" stop-color="#42E0FF"/>
      <stop offset="1" stop-color="#A48BFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(945 303) rotate(90) scale(150)">
      <stop stop-color="#5DE4FF" stop-opacity="0.31"/>
      <stop offset="1" stop-color="#5DE4FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8CA8C8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1115" cy="32" r="260" fill="#6B56E8" fill-opacity="0.14"/>
  <circle cx="65" cy="604" r="220" fill="#B8FF3C" fill-opacity="0.06"/>

  <g transform="translate(76 66) scale(0.14)">
