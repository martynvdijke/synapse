<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse — Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .setup-card { background: #fff; border-radius: .5rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 40px; width: 100%; max-width: 420px; }
    </style>
</head>
<body>
    <div class="setup-card">
        <h4 class="text-center mb-1">Synapse</h4>
        <p class="text-center text-muted mb-4">Initial Setup</p>
        <div id="error" class="alert alert-danger d-none"></div>
        <form id="setup-form">
            <div class="mb-3">
                <label for="username" class="form-label">Admin Username</label>
                <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Admin Password</label>
                <input type="password" class="form-control" id="password" name="password" required minlength="8" autocomplete="new-password">
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Admin Account</button>
        </form>
    </div>
    <script>
        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const password = fd.get('password');
            const confirm = fd.get('confirm_password');
            const errorDiv = document.getElementById('error');
            errorDiv.classList.add('d-none');

            if (password !== confirm) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.remove('d-none');
                return;
            }

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: fd.get('username'),
                    password: password,
                    setup: true
                })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                const err = await res.json();
                errorDiv.textContent = err.error || 'Setup failed';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
